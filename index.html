<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>إعادة تشغيل الذهب XAUUSD</title>
<script>(function(){function show(m){try{var b=document.getElementById('errBox');if(!b){b=document.createElement('div');b.id='errBox';b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#a00;color:#fff;padding:10px;font:14px Tahoma,Arial;direction:rtl;white-space:pre-wrap;max-height:40vh;overflow:auto';(document.body||document.documentElement).appendChild(b);}b.textContent+= '⚠️ خطأ في التطبيق: '+m+'\n';}catch(e){}}
window.onerror=function(m,src,l,c){show(m+' ('+(src||'').split('/').pop()+':'+l+')');};
window.addEventListener('unhandledrejection',function(e){show('Promise: '+(e.reason&&e.reason.message||e.reason));});window.__showErr=show;})();</script>
<script src="vendor/lightweight-charts-4.2.0.compat.js"></script>
<script>if(!window.LightweightCharts)window.__showErr('تعذر تحميل مكتبة الرسم البياني');</script>
<link rel="stylesheet" href="style.css"></head><body>
<header><b>🟡 تدريب الذهب</b> <span id="clock">—</span> <span id="price"></span> <span id="status"></span></header>
<div id="chartWrap" dir="ltr"><div id="chart"></div><canvas id="ov"></canvas></div>
<div class="row" id="ctrl">
 <select id="tf"><option>M5</option><option selected>M15</option><option>H1</option><option>H4</option><option>D1</option></select>
 <button id="bNext">▶| شمعة</button><button id="bPlay">⏵ تشغيل</button>
 <select id="speed"><option value="1000">1x</option><option value="500" selected>2x</option><option value="250">4x</option><option value="100">10x</option></select>
 <button id="bDay">+يوم</button>
</div>
<div class="row" id="draw">
 <button data-m="hline">— أفقي</button><button data-m="tline">╱ ترند</button><button data-m="chan">⫽ قناة</button>
 <button data-m="edit">✋ تعديل</button><button data-m="del">🗑 حذف</button><button id="bClr">مسح الكل</button>
 <button id="bSmc">SMC ⚙</button>
</div>
<div id="smcPanel" class="panel hidden">
 <label><input type="checkbox" id="s_on" checked> تفعيل SMC</label>
 <label><input type="checkbox" id="s_istr" checked> هيكل داخلي (5)</label>
 <label><input type="checkbox" id="s_sstr" checked> هيكل رئيسي (50)</label>
 <label><input type="checkbox" id="s_iob" checked> أوردر بلوك داخلي</label>
 <label><input type="checkbox" id="s_sob" checked> أوردر بلوك رئيسي</label>
 <label><input type="checkbox" id="s_fvg" checked> فجوات FVG</label>
 <label><input type="checkbox" id="s_sw" checked> قمم/قيعان قوية وضعيفة</label>
 <label><input type="checkbox" id="s_zone" checked> مناطق Premium/Discount</label>
</div>
<div class="panel" id="trade">
 <div class="row">
  <label>اللوت <input id="lots" type="number" step="0.01" value="0.01" inputmode="decimal"></label>
  <label>وقف الخسارة SL <input id="sl" type="number" step="0.01" inputmode="decimal"></label>
  <label>الهدف TP <input id="tp" type="number" step="0.01" inputmode="decimal"></label>
 </div>
 <div class="row small"><button id="bAuto">SL/TP تلقائي (1:2)</button><span id="risk">المخاطرة: —</span></div>
 <textarea id="why" placeholder="لماذا دخلت الصفقة؟"></textarea>
 <input id="feel" placeholder="شعوري (هادئ، متوتر، طماع...)">
 <div class="row"><button id="bBuy" class="buy">شراء BUY</button><button id="bSell" class="sell">بيع SELL</button><button id="bClose">إغلاق الصفقة</button></div>
 <div id="pos">لا توجد صفقة مفتوحة</div>
 <div class="row small">الرصيد: <b id="bal">1000</b>$ &nbsp; رصيد البداية <input id="startBal" type="number" value="1000"></div>
</div>
<div class="panel"><div class="row"><button id="bQuiz">🎯 وضع الاختبار</button><button id="bCoach">📤 إرسال للمدرب (تنزيل)</button><button id="bCoachCopy">📋 نسخ للمدرب</button><button id="bCoachShare">🔗 مشاركة</button></div></div>
<div class="panel hidden" id="quizP"><h3>🎯 اختبار: حدد الاتجاه والخطة قبل الكشف</h3>
 <div class="row"><button id="qUp" class="buy">صاعد ⬆</button><button id="qDn" class="sell">هابط ⬇</button><span id="qBias"></span></div>
 <div class="row"><label>دخول <input id="qE" type="number" step="0.01"></label><label>SL <input id="qSL" type="number" step="0.01"></label><label>TP <input id="qTP" type="number" step="0.01"></label>
 <label>اكشف <select id="qN"><option>10</option><option selected>20</option><option>50</option></select> شمعة</label></div>
 <div class="row"><button id="qGo">👁 اكشف وقيّم</button><button id="qX">إنهاء الاختبار</button></div><div id="qRes" style="padding:6px"></div></div>
<div class="panel" id="statsP"><h3>الإحصائيات</h3><div id="stats"></div><canvas id="eq" height="120"></canvas></div>
<div class="panel"><h3>الجلسة</h3>
 <div class="row"><input type="date" id="startDate"><button id="bStart">ابدأ من التاريخ</button><button id="bRand">تاريخ عشوائي</button></div>
 <div class="small">يتم حفظ موضعك تلقائياً. البيانات: <span id="range"></span> (توقيت برلين)</div></div>
<div class="panel"><h3>سجل الصفقات</h3>
 <div class="row"><button id="bCsv">تصدير CSV</button><button id="bJson">تصدير JSON</button><label class="btn">استيراد<input type="file" id="imp" accept=".json,.csv" hidden></label><button id="bWipe">حذف السجل</button></div>
 <div id="journal"></div></div>
<script src="app.js?v=2"></script></body></html>
